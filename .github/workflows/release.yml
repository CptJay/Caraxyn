name: Release

# Pushing a tag like v0.2.0 builds the installers into a draft GitHub Release.
# Nothing is public until someone presses Publish on the draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The app's version comes from the workspace Cargo.toml (tauri.conf.json has none).
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      # Skipped when it exists, so "Re-run all jobs" works after a failed build.
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "Caraxyn $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    strategy:
      # One platform failing does not cancel the other, so both results show.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: appimage
            file: AppImage
          # Unsigned: Windows SmartScreen warns about an unknown publisher on first run.
          - os: windows-latest
            bundle: nsis
            file: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Same packages as CI; AppImage bundling also needs FUSE to run its tools.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libfuse2
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/caraxyn/ui/package-lock.json
      - run: npm ci
        working-directory: crates/caraxyn/ui
      # bash on Windows too: PowerShell drops the bare `--`, so --locked reached tauri.
      - run: ui/node_modules/.bin/tauri build --ci --bundles ${{ matrix.bundle }} -- --locked
        shell: bash
        working-directory: crates/caraxyn
        # Signs the installer for the updater (a .sig next to it); the public key is in tauri.conf.json.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Upload to the draft
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.file }} target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.file }}.sig --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # latest.json tells installed apps about this release. They read it from the newest
  # *published* release, so a draft changes nothing until it is published.
  manifest:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir sigs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Write latest.json
        shell: python
        run: |
          import json, os, pathlib
          tag = os.environ["GITHUB_REF_NAME"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          platforms = {}
          for sig in pathlib.Path("sigs").glob("*.sig"):
              installer = sig.name.removesuffix(".sig")
              key = "linux-x86_64" if installer.endswith(".AppImage") else "windows-x86_64"
              platforms[key] = {"signature": sig.read_text(), "url": f"{base}/{installer}"}
          assert set(platforms) == {"linux-x86_64", "windows-x86_64"}, platforms
          manifest = {"version": tag.removeprefix("v"), "platforms": platforms}
          pathlib.Path("latest.json").write_text(json.dumps(manifest, indent=2))
      - run: gh release upload "$GITHUB_REF_NAME" latest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}

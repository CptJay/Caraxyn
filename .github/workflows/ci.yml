name: CI

on:
  pull_request:
  # Only main: branch pushes are covered by their PR. Also seeds the cache PRs can reuse.
  push:
    branches: [main]

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The desktop app (Tauri) links against WebKitGTK on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      # rustup reads rust-toolchain.toml and installs that exact toolchain.
      - run: rustup show
      # Caches the compiled dependencies between runs (keyed on the toolchain and Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --locked: fail if Cargo.lock is out of date instead of silently updating it.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The desktop app's frontend: types, lint (no `{@html}`), tests, and that it builds.
  ui:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/caraxyn/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/caraxyn/ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

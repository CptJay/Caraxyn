name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs that exact toolchain.
      - run: rustup show
      # Caches the compiled dependencies between runs (keyed on the toolchain and Cargo.lock).
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --locked: fail if Cargo.lock is out of date instead of silently updating it.
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

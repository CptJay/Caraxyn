[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

# Versions are written here once; crates opt in with `dep = { workspace = true }`.
[workspace.dependencies]
# data-encoding, postcard, rand, redb and serde are pinned to the versions iroh
# already pulls in, so using them ourselves builds nothing extra.
data-encoding = "2.11.1"
hex = "0.4.3"
# Pinned exactly: the iroh crates move fast and must match each other.
iroh = "=1.4.1"
iroh-blobs = "=0.104.0"
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.10.3"
redb = "4.4.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Rules written once; crates opt in with `[lints] workspace = true`.
# Clippy runs at its default level (see CI: `-D warnings`).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

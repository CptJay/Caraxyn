[package]
name = "caraxyn"
description = "Caraxyn desktop app: a Tauri window over caraxyn-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
caraxyn-core = { path = "../caraxyn-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# tray-icon: the icon and menu that keep the app reachable when the window is closed.
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
# Finds, downloads and installs new releases (signed; see tauri.conf.json).
tauri-plugin-updater = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

[lints]
workspace = true
